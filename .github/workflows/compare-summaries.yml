name: Compare video summaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Compare the same video with three prompts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
        run: python compare_summaries.py --video-id TI-Qa30nyjY
      - name: Save comparison outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-comparison
          path: comparison-results/
          retention-days: 7
          if-no-files-found: warn
